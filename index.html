<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Said Özen | Kişisel Portfolyo</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0b0f19;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .card {
            background: rgba(17, 24, 39, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 40px;
            max-width: 500px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }
        h1 {
            font-size: 2.5rem;
            font-weight: 800;
            color: #22c55e;
            margin-bottom: 8px;
        }
        .title-sub {
            font-size: 1.1rem;
            color: #94a3b8;
            margin-bottom: 24px;
        }
        p {
            font-size: 1rem;
            color: #cbd5e1;
            line-height: 1.6;
            margin-bottom: 24px;
        }
        .tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            margin-bottom: 30px;
        }
        .tag {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            color: #e2e8f0;
        }
        .btn-group {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-bottom: 30px;
        }
        .btn {
            background: #22c55e;
            color: #000;
            padding: 12px 24px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: 0.2s;
        }
        .btn:hover { background: #16a34a; }
        .btn-outline {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
        }
        .btn-outline:hover { background: rgba(255, 255, 255, 0.05); }
        .socials {
            display: flex;
            justify-content: center;
            gap: 20px;
            font-size: 1.5rem;
        }
        .socials a { color: #94a3b8; transition: 0.2s; }
        .socials a:hover { color: #22c55e; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Said Özen</h1>
        <div class="title-sub">Büyük Veri Analistliği Öğrencisi</div>
        
        <p>Büyük Veri Analistliği programında öğrenciyim. Veri analitiği, yazılım ve modern web teknolojileri alanlarında çalışıyor, kendimi geliştiriyorum.</p>
        
        <div class="tags">
            <span class="tag">Büyük Veri</span>
            <span class="tag">Veri Analitiği</span>
            <span class="tag">Web Geliştirme</span>
            <span class="tag">Python & SQL</span>
        </div>

        <div class="btn-group">
            <a href="mailto:epostan@ornek.com" class="btn"><i class="fa-solid fa-envelope"></i> İletişim</a>
            <a href="https://github.com/saidozen" target="_blank" class="btn btn-outline"><i class="fa-brands fa-github"></i> GitHub</a>
        </div>
    </div>
</body>
</html>
